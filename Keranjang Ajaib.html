function A(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,ty,v,at){try{const a=A();if(!a)return;const t=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const MEL=[523,659,784,659,880,784,659,587,523,659,784,1047,880,784,659,587],BAS=[262,262,330,330,349,349,392,392];
function stopM(){if(mt){clearInterval(mt);mt=null}}
function startM(){stopM();if(!S.music||!A())return;mt=setInterval(()=>{tone(MEL[st%16],.25,'triangle',.06);if(st%2===0)tone(BAS[(st>>1)%8],.45,'sine',.07);st++},270)}
const sOk=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.09));
const sNo=()=>{tone(260,.2,'sine',.12,0);tone(200,.3,'sine',.12,.16)};
/* render */
const title=()=>[...'KERANJANG AJAIB'].map((c,i)=>c===' '?'<span> </span>':`<span style="color:${['#FFD400','#FF2E93','#fff','#FF7A00','#6FE0FF'][i%5]}">${c}</span>`).join('');
const basket=`<svg class="b" viewBox="0 0 130 96"><path d="M30 34C30 -6 100 -6 100 34" stroke="#7a4a1a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M14 34H116L104 88Q65 96 26 88Z" fill="url(#gBk)" stroke="#5a3510" stroke-width="3" stroke-linejoin="round"/><path d="M20 48H110M22 62H108M25 76H105M40 36L36 90M60 36V92M80 36V92M100 36L96 90" stroke="#7a4a1a" stroke-width="2"/><rect x="10" y="26" width="110" height="12" rx="6" fill="#c58a3e" stroke="#5a3510" stroke-width="3"/></svg>`;
function icon(l){
 if(l===1)return`<svg viewBox="0 0 200 100"><ellipse cx="100" cy="92" rx="90" ry="6" fill="rgba(0,0,0,.18)"/><circle cx="38" cy="58" r="30" fill="url(#gR)" stroke="#7a0a10" stroke-width="3"/><ellipse cx="28" cy="46" rx="8" ry="5" fill="#fff" fill-opacity=".6"/><polygon points="100,14 134,86 66,86" fill="url(#gY)" stroke="#8a6a00" stroke-width="3" stroke-linejoin="round"/><polygon points="100,14 100,86 66,86" fill="#fff" fill-opacity=".18"/><polygon points="164,30 192,44 164,58 136,44" fill="#7be08a" stroke="#0F6B22" stroke-width="3" stroke-linejoin="round"/><polygon points="136,44 164,58 164,90 136,76" fill="#1FAF3A" stroke="#0F6B22" stroke-width="3" stroke-linejoin="round"/><polygon points="192,44 164,58 164,90 192,76" fill="#0d7a22" stroke="#0F6B22" stroke-width="3" stroke-linejoin="round"/></svg>`;
 if(l===2)return`<svg viewBox="0 0 200 120"><path d="M100 10C46 8 8 40 14 74C20 106 64 112 80 98C92 88 84 78 100 76C118 74 118 96 140 98C176 100 196 70 188 46C178 18 142 10 100 10Z" fill="#D9A066" stroke="#5a3510" stroke-width="4"/><circle cx="52" cy="46" r="15" fill="#E5101F" stroke="#7a0a10" stroke-width="3"/><circle cx="92" cy="30" r="15" fill="#FFD400" stroke="#8a6a00" stroke-width="3"/><circle cx="136" cy="38" r="15" fill="#1FAF3A" stroke="#0F6B22" stroke-width="3"/><circle cx="46" cy="82" r="11" fill="#fff" stroke="#5a3510" stroke-width="3"/><path d="M150 112L192 70" stroke="#8a4a1a" stroke-width="7" stroke-linecap="round"/><path d="M186 76L198 62" stroke="#E5101F" stroke-width="7" stroke-linecap="round"/></svg>`;
 return`<div style="display:flex;align-items:flex-end;gap:6px">${svg('bola',104)}${svg('bola',42)}</div>`}
function head(){return`<div class="hd"><span>👤 ${esc(S.name)}</span><span>⭐ Skor: ${S.score}</span>`}
function render(){
 const app=document.getElementById('app');let h='';
 document.getElementById('mc').innerHTML=S.started?`<button id="mus" class="btn white" data-a="music" aria-label="Musik">${S.music?'🔊':'🔇'}</button>`:'';
 if(S.screen==='name'){
  h=`<div class="center"><h1 class="title">${title()}</h1><p class="sub">Halo, teman hebat! Ayo bermain sambil belajar!</p><div class="panel"><input id="nm" placeholder="Masukkan nama kamu..." maxlength="20" autocomplete="off" value="${esc(S.nameInput)}"><button class="btn pink" data-a="submit">SUBMIT</button>${S.err?'<p class="err">Yuk, isi nama kamu dulu!</p>':''}${S.ok?`<div id="okb"><p class="okmsg">Halo, ${esc(S.name)}! Selamat bermain!</p><button class="btn green big" data-a="start">MULAI BERMAIN</button></div>`:''}</div></div>`}
 else if(S.screen==='menu'){
  h=`<div class="center"><h2 class="h2">PILIH LEVEL</h2>${head().replace('class="hd"','class="hd" style="justify-content:center;gap:30px;max-width:520px;margin:0 auto"')}</div><div class="cards">`+[1,2,3].map(l=>{
   const lock=l>1&&!S.done[l-1],dn=S.done[l],pr=S.solved[l].length&&!dn;
   return`<div class="lv ${lock?'lock':''}" style="background:${LV[l].c}"><div class="n">${l}</div>${lock?'<div class="lk">🔒</div>':''}<div class="ic">${icon(l)}</div><h3>LEVEL ${l}<br>${LV[l].t}</h3><div class="st">${lock?'Selesaikan level sebelumnya':dn?'✅ SELESAI! ⭐⭐⭐':pr?'Lanjutkan, ya!':'AYO MAIN!'}</div><button class="btn ${dn?'white':'pink'} big" ${lock?'disabled':''} data-a="${dn?'replay':'play'}" data-v="${l}">${dn?'MAIN LAGI':'▶ MULAI'}</button></div>`}).join('')+`</div><div class="ctl" style="margin-top:46px"><button class="btn pur" data-a="switch">👤 GANTI PEMAIN</button></div>`}
 else if(S.screen==='game'){
  const L=LV[S.level],sv=S.solved[S.level],tot=L.i.length,all=sv.length===tot,lay=S.layouts[S.level];
  h=`${head()}<span class="bar"><i style="width:${sv.length/tot*100}%"></i></span><span>${L.t}: ${sv.length} dari ${tot} benda selesai</span></div><div class="lab">PILIH BENDA</div><div class="tray">`+lay.map(p=>{const it=L.i.find(x=>x.id===p.id),g=sv.includes(it.id);
   return`<button class="it ${g?'gone':''} ${S.sel===it.id?'sel':''}" style="transform:rotate(${p.rot}deg) translateY(${p.dy}px)" data-a="item" data-v="${it.id}" ${g?'tabindex="-1"':''}><span class="box">${svg(it.k,100*it.s)}</span>${esc(it.n)}</button>`}).join('')+`</div>`;
  const m={ok:['⭐ BENAR! HEBAT! ⭐','ok'],no:['COBA LAGI, YA!','no'],hint:['Pilih bendanya dulu, ya!','hint']}[S.fb];
  let stars='';if(S.fb==='ok')for(let i=0;i<8;i++){const a=i/8*6.28;stars+=`<s style="--x:${Math.cos(a)*140}px;--y:${Math.sin(a)*60}px">⭐</s>`}
  h+=`<div class="fb ${m?m[1]:''}">${m?m[0]+stars:''}</div>`;
  if(all)h+=`<div class="done"><h3>🎉 LEVEL SELESAI! 🎉</h3><button class="btn green big" data-a="next">${S.level<3?'LANJUT KE LEVEL BERIKUTNYA':'LIHAT HASIL AKHIR'}</button></div>`;
  h+=`<div class="lab">PILIH KERANJANG</div><div class="bks">`+L.b.map(b=>{const c=BKCOL[b.id]||['#FFF3A8','#1B1464'];
   const inside=L.i.filter(x=>x.a===b.id&&sv.includes(x.id)).map(x=>`<span>${svg(x.k,x.s<1?36:60)}</span>`).join('');
   return`<button class="bk ${L.b.length===2?'two':''}" data-a="basket" data-v="${b.id}" id="bk-${b.id}">${basket}<div class="bd" style="background:${c[0]};color:${c[1]}">${b.l}</div><div class="cont">${inside}</div></button>`}).join('')+`</div><div class="ctl"><button class="btn white" data-a="retry">↺ ULANGI LEVEL</button><button class="btn white" data-a="menu">KEMBALI KE MENU</button></div>`}
 else{
  let cf='';const cc=['#FFD400','#FF2E93','#1E90FF','#1FAF3A','#FF7A00','#8A2BE2'];for(let i=0;i<70;i++)cf+=`<i class="cf" style="left:${R(0,100)}vw;background:${cc[i%6]};animation-duration:${R(2.5,5)}s;animation-delay:${R(-5,0)}s"></i>`;
  h=`${cf}<div class="center"><div class="big-s">🏆</div><h1 class="title" style="font-size:clamp(34px,7vw,72px);color:#FFD400">SELAMAT, ${esc(S.name)}!</h1><div class="panel"><div style="font-size:clamp(30px,5vw,52px)">⭐ Skor akhir: ${S.score} ⭐</div><p style="font-size:clamp(20px,3vw,30px)">Kamu hebat dalam mengelompokkan benda!</p></div><div class="ctl" style="margin-top:28px"><button class="btn green big" data-a="again">MAIN LAGI</button><button class="btn white big" data-a="menu">KEMBALI KE MENU</button></div><div class="ctl" style="margin-top:44px"><button class="btn pur" data-a="switch">👤 GANTI PEMAIN</button></div></div>`}
 if(S.confirm)h+=`<div class="mod"><div class="panel center"><p style="font-size:clamp(24px,3.4vw,34px)">Yakin mau ganti pemain? Skor pemain ini akan dihapus.</p><div class="ctl"><button class="btn pink" data-a="yes">YA, GANTI</button><button class="btn white" data-a="no">BATAL</button></div></div></div>`;
 app.innerHTML=h;
}
function resetLv(l){S.score-=S.solved[l].length*10;S.solved[l]=[];S.layouts[l]=mk(l);S.sel=null;S.fb=null}
function submit(){const v=document.getElementById('nm').value.trim();S.nameInput=document.getElementById('nm').value;if(!v){S.err=true;S.ok=false}else{S.err=false;S.ok=true;S.name=v}render()}
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.nameInput=e.target.value;if(S.ok){S.ok=false;const o=document.getElementById('okb');if(o)o.remove()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm')submit()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='submit')return submit();
 if(a==='start'){S.started=true;S.screen='menu';S.music=true;startM();return render()}
 if(a==='music'){S.music=!S.music;S.music?startM():stopM();return render()}
 if(a==='play'){const l=+v;if(l>1&&!S.done[l-1])return;S.level=l;if(!S.layouts[l])S.layouts[l]=mk(l);S.sel=null;S.fb=null;S.screen='game';return render()}
 if(a==='replay'){const l=+v;resetLv(l);S.level=l;S.screen='game';return render()}
 if(a==='item'){const it=LV[S.level].i.find(x=>x.id===v);if(S.solved[S.level].includes(v))return;S.sel=S.sel===v?null:v;S.fb=null;return render()}
 if(a==='basket'){const L=LV[S.level];if(!S.sel){S.fb='hint';return render()}
  const it=L.i.find(x=>x.id===S.sel);
  if(it.a===v){if(!S.solved[S.level].includes(it.id)){S.solved[S.level].push(it.id);S.score+=10}S.sel=null;S.fb='ok';sOk();if(S.solved[S.level].length===L.i.length)S.done[S.level]=true;render();const k=document.getElementById('bk-'+v);if(k)k.classList.add('hit')}
  else{S.fb='no';sNo();render()}return}
 if(a==='retry'){resetLv(S.level);return render()}
 if(a==='menu'){S.screen='menu';S.sel=null;S.fb=null;return render()}
 if(a==='next'){if(S.level<3){S.level++;if(!S.layouts[S.level])S.layouts[S.level]=mk(S.level);S.fb=null;S.sel=null}else S.screen='final';return render()}
 if(a==='again'){S.score=0;S.solved={1:[],2:[],3:[]};S.done={1:false,2:false,3:false};S.layouts={1:mk(1)};S.level=1;S.sel=null;S.fb=null;S.screen='game';return render()}
 if(a==='switch'){S.confirm=true;return render()}
 if(a==='no'){S.confirm=false;return render()}
 if(a==='yes'){stopM();S=S0();return render()}
});
render();
</script></body></html>
